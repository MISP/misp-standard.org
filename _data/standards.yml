  featured: true
  library:
    name: Taxonomy library
    url: https://www.misp-project.org/taxonomies.html
    pdf: https://www.misp-project.org/taxonomies.pdf
  lead:
    name: MISP Project
    url: https://www.misp-project.org/

- title: MISP galaxy format
  id: misp-galaxy-format
  specification: misp-standard-galaxy-format
  description: Organize threat actors, malware, and other contextual data into clusters that can be attached to MISP events and attributes.
